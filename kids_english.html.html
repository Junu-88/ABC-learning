<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A-Z Dotted Handwriting & Tracing App</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background-color: #EBF8FA;
      margin: 0;
      padding: 20px;
      user-select: none;
    }

    h1 {
      color: #00796B;
      font-size: 30px;
      margin: 0 0 6px 0;
    }

    p.subtitle {
      color: #004D40;
      font-size: 16px;
      margin-bottom: 20px;
    }

    /* Alphabet Grid */
    .btn-grid {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      max-width: 920px;
      margin: 0 auto 20px auto;
    }

    .letter-btn {
      width: 52px;
      height: 52px;
      font-size: 26px;
      font-weight: bold;
      color: white;
      background: #FF7043;
      border: none;
      border-radius: 14px;
      box-shadow: 0 4px 0 #D84315;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.1s ease;
    }

    .letter-btn:hover {
      background: #FF8A65;
    }

    .letter-btn:active, .letter-btn.active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #D84315;
      background: #009688;
    }

    /* Main Display Card */
    #display-card {
      background: white;
      border-radius: 24px;
      padding: 25px;
      max-width: 680px;
      margin: 0 auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      border: 4px solid #B2EBF2;
    }

    #main-title {
      font-size: 28px;
      color: #00796B;
      margin: 0 0 15px 0;
    }

    .canvas-container {
      position: relative;
      display: inline-block;
      margin: 10px 0;
    }

    #tracing-canvas {
      border: 2px solid #B0BEC5;
      border-radius: 12px;
      background: #FFFFFF;
      cursor: crosshair;
      touch-action: none;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.04);
    }

    .controls-row {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .action-btn {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: bold;
      color: white;
      background: #0288D1;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 3px 0 #01579B;
    }

    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #01579B;
    }

    /* Step Descriptions */
    #steps-container {
      margin-top: 20px;
      padding: 16px 20px;
      background-color: #FFF8E1;
      border: 2px solid #FFE082;
      border-radius: 16px;
      text-align: left;
    }

    #steps-title {
      font-weight: bold;
      color: #E65100;
      margin-bottom: 10px;
      font-size: 18px;
      text-align: center;
    }

    .step-item {
      font-size: 15px;
      color: #4E342E;
      margin: 8px 0;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #sentence-text {
      font-size: 22px;
      color: #3F51B5;
      margin-top: 18px;
      font-weight: 600;
    }
  </style>
</head>

    let currentLetter = 'A';
    let isDrawing = false;

    const canvas = document.getElementById('tracing-canvas');
    const ctx = canvas.getContext('2d');

    // Build letter selection grid
    const gridContainer = document.getElementById('alphabet-grid');
    const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

    alphabet.forEach(lettr => {
      const btn = document.createElement('button');
      btn.className = 'letter-btn';
      btn.innerText = lettr;
      btn.onclick = () => selectLetter(lettr);
      gridContainer.appendChild(btn);
    });

    // Touch & Pointer interaction
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      isDrawing = true;
      const pos = getPointerPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const pos = getPointerPos(e);
      
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#43A047'; // Green user tracing stroke

      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      isDrawing = false;
      ctx.beginPath();
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    canvas.addEventListener('touchstart', (e) => { startDrawing(e); e.preventDefault(); });
    canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });
    canvas.addEventListener('touchend', stopDrawing);

    // Draw background guidelines matching standard paper
    function drawHandwritingGuidelines() {
      ctx.save();
      
      // Top Solid Line (Light Blue)
      ctx.strokeStyle = '#29B6F6';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, 50);
      ctx.lineTo(canvas.width, 50);
      ctx.stroke();

      // Middle Dashed Line (Light Blue)
      ctx.strokeStyle = '#29B6F6';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([12, 10]);
      ctx.beginPath();
      ctx.moveTo(0, 150);
      ctx.lineTo(canvas.width, 150);
      ctx.stroke();
      ctx.setLineDash([]);

      // Bottom Solid Line (Pink/Red)
      ctx.strokeStyle = '#EC407A';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 250);
      ctx.lineTo(canvas.width, 250);
      ctx.stroke();

      ctx.restore();
    }

    // Draw green starting dots where strokes begin
    function drawStartDots(dots) {
      if (!dots) return;
      ctx.save();
      dots.forEach(pt => {
        ctx.fillStyle = '#2E7D32';
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(pt[0], pt[1], 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });
      ctx.restore();
    }

    // Helper to draw red arrows along strokes
    function drawRedArrow(x1, y1, x2, y2, number, nx, ny) {
      ctx.save();
      ctx.strokeStyle = '#E53935';
      ctx.fillStyle = '#E53935';
      ctx.lineWidth = 3.5;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      const angle = Math.atan2(y2 - y1, x2 - x1);
      const headLen = 14;
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();

      if (number) {
        ctx.font = 'bold 22px Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(number, nx, ny);
      }

      ctx.restore();
    }

    // Helper for curved red arrows
    function drawRedArcArrow(cx, cy, r, startAngle, endAngle, number, nx, ny) {
      ctx.save();
      ctx.strokeStyle = '#E53935';
      ctx.fillStyle = '#E53935';
      ctx.lineWidth = 3.5;

      ctx.beginPath();
      ctx.arc(cx, cy, r, startAngle, endAngle, false);
      ctx.stroke();

      const endX = cx + r * Math.cos(endAngle);
      const endY = cy + r * Math.sin(endAngle);
      const tangentAngle = endAngle + Math.PI / 2;

      const headLen = 14;
      ctx.beginPath();
      ctx.moveTo(endX, endY);
      ctx.lineTo(endX - headLen * Math.cos(tangentAngle - Math.PI / 6), endY - headLen * Math.sin(tangentAngle - Math.PI / 6));
      ctx.lineTo(endX - headLen * Math.cos(tangentAngle + Math.PI / 6), endY - headLen * Math.sin(tangentAngle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();

      if (number) {
        ctx.font = 'bold 22px Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(number, nx, ny);
      }

      ctx.restore();
    }

    // Render guide strokes (DOTTED line paths for tracing)
    function renderGuide() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      drawHandwritingGuidelines();

      const data = letterData[currentLetter] || letterData['A'];

      // Draw Dotted Tracing Guidelines for Letters
      ctx.save();
      ctx.strokeStyle = '#424242';
      ctx.lineWidth = 18;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.setLineDash([4, 16]); // Dotted stroke pattern for tracing!

      const drawStrokes = (strokes) => {
        strokes.forEach(s => {
          ctx.beginPath();
          if (s.type === 'line') {
            ctx.moveTo(s.from[0], s.from[1]);
            ctx.lineTo(s.to[0], s.to[1]);
            ctx.stroke();
          } else if (s.type === 'bezier') {
            ctx.moveTo(s.from[0], s.from[1]);
            ctx.bezierCurveTo(s.cp1[0], s.cp1[1], s.cp2[0], s.cp2[1], s.to[0], s.to[1]);
            ctx.stroke();
          } else if (s.type === 'arc') {
            ctx.arc(s.cx, s.cy, s.r, s.start, s.end);
            ctx.stroke();
          } else if (s.type === 'circle') {
            ctx.arc(s.cx, s.cy, s.r, 0, Math.PI * 2);
            ctx.stroke();
          }
        });
      };

      if (data.upperStrokes) drawStrokes(data.upperStrokes);
      if (data.lowerStrokes) drawStrokes(data.lowerStrokes);
      ctx.restore();

      // Draw Start Dots 🟢
      if (data.upperStartDots) drawStartDots(data.upperStartDots);
      if (data.lowerStartDots) drawStartDots(data.lowerStartDots);

      // Draw Red Directional Arrows & Numbers 🔴
      if (data.upperArrows) {
        data.upperArrows.forEach(arr => {
          if (arr.type === 'arc') drawRedArcArrow(arr.cx, arr.cy, arr.r, arr.start, arr.end, arr.num, arr.nx, arr.ny);
          else drawRedArrow(arr.x1, arr.y1, arr.x2, arr.y2, arr.num, arr.nx, arr.ny);
        });
      }

      if (data.lowerArrows) {
        data.lowerArrows.forEach(arr => {
          if (arr.type === 'arc') drawRedArcArrow(arr.cx, arr.cy, arr.r, arr.start, arr.end, arr.num, arr.nx, arr.ny);
          else drawRedArrow(arr.x1, arr.y1, arr.x2, arr.y2, arr.num, arr.nx, arr.ny);
        });
      }
    }

    function clearUserStrokes() {
      renderGuide();
    }

    function selectLetter(letter) {
      currentLetter = letter;
      document.querySelectorAll('.letter-btn').forEach(b => {
        b.classList.toggle('active', b.innerText === letter);
      });

      const data = letterData[letter];

      document.getElementById('main-title').innerText = `${data.letter} ${data.letter.toLowerCase()} - ${data.word}`;
      document.getElementById('sentence-text').innerText = data.sentence;

      const stepsContainer = document.getElementById('steps-container');
      const stepsList = document.getElementById('steps-list');
      stepsList.innerHTML = '';

      if (data.steps && data.steps.length > 0) {
        stepsContainer.style.display = 'block';
        data.steps.forEach((stepText) => {
          const div = document.createElement('div');
          div.className = 'step-item';
          div.innerText = stepText;
          stepsList.appendChild(div);
        });
      } else {
        stepsContainer.style.display = 'none';
      }

      renderGuide();
      replayAudio();
    }

    function replayAudio() {
      const data = letterData[currentLetter];
      const speechText = `${data.letter}. ${data.word}. ${data.sentence}`;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(speechText);
      utterance.rate = 0.85;
      utterance.pitch = 1.1;
      window.speechSynthesis.speak(utterance);
    }

    // Default select 'A' on load
    selectLetter('A');
  </script>
</body>
</html>
